name: Deploy

# One-click backend deploy from GitHub (Actions tab → Deploy → Run workflow). It re-runs the rules
# tests + functions lint first (via scripts/deploy.mjs), then deploys — so a bad rule can't go out.
#
# ONE-TIME SETUP (only you can do this):
#   1. Firebase console → Project settings → Service accounts → Generate new private key (JSON).
#   2. GitHub repo → Settings → Secrets and variables → Actions → New secret:
#        name:  FIREBASE_SERVICE_ACCOUNT      value: paste the whole JSON file
#   After that, deploying is a button. Nothing sensitive is ever stored in the repo.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        default: "database,storage,functions"
        type: choice
        options:
          - "database,storage,functions"
          - "database,storage"
          - "functions"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Write service-account credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. See the setup note in this workflow file."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy (tests + lint + deploy)
        run: node scripts/deploy.mjs --only ${{ github.event.inputs.target }}
